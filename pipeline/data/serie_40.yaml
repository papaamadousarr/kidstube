series:
  key: serie_40
  title: Les Règles d'Or de l'IA !
  voice: fr_FR-siwis-medium
  background_color: '#FFF0F5'
  intro_text: Pour que l'Intelligence Artificielle soit toujours gentille et juste
    avec nous !
items:
- name: IA gentille
  script: L'ordinateur doit toujours être bienveillant !
  accent_color: '#FF69B4'
- name: Être juste
  script: Il doit prendre des décisions équitables pour tous !
  accent_color: '#C71585'
- name: Pas de bêtises
  script: L'IA ne doit jamais faire de choses méchantes !
  accent_color: '#DB7093'
- name: Respecter tout le monde
  script: Il doit traiter tout le monde avec égard !
  accent_color: '#FF1493'
- name: Bien faire
  script: Son but est d'aider et de faire le bien !
  accent_color: '#FFC0CB'
