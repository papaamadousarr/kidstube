  title: Le Robot Assistant
  voice: fr_FR-siwis-medium
  background_color: '#FDF5E6'
  intro_text: Un robot très serviable qui t'aide dans la vie de tous les jours !
items:
- name: Le Réveil Malin
  script: Je te réveille le matin ! Bonjour !
  accent_color: '#FFDEAD'
- name: Le Rappel des Tâches
  script: N'oublie pas ton goûter ! Je te le dis !
  accent_color: '#DDA0DD'
