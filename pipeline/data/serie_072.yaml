series:
  key: serie_072
  title: Les Commandes Vocales
  voice: fr_FR-siwis-medium
  background_color: '#FFFACD'
  intro_text: Dis ce que tu veux faire, et l'ordinateur obéit ! C'est comme parler
    à un ami.
items:
- name: Ouvre l'Application !
  script: Je dis 'Ouvre Dessin', et ça s'ouvre !
  accent_color: '#FFD700'
- name: Change la Musique !
  script: Je dis 'Musique douce', et ça change !
  accent_color: '#FFA07A'
- name: Écris mon Message !
  script: Je parle, et le robot écrit pour moi !
  accent_color: '#ADFF2F'
- name: Le Robot Écouteur
  script: Il m'entend et comprend ce que je dis !
  accent_color: '#98FB98'
- name: Parle, et C'est Fait !
  script: Plus besoin de toucher, juste de parler !
  accent_color: '#FFB6C1'
