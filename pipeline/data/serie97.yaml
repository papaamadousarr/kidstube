  title: Le Robot qui S'adapte !
  voice: fr_FR-siwis-medium
  background_color: '#FFFAFA'
  intro_text: Le robot est très malin ! Il peut changer sa façon de faire s'il rencontre
    un problème, pour toujours réussir sa mission.
