items:
- name: J'attrape !
  script: Je saisis l'objet doucement !
  accent_color: '#87CEFA'
- name: Je Lâche !
  script: Je le dépose délicatement !
  accent_color: '#FFB6C1'
- name: Je Tiens Fort !
  script: Je le garde bien en sécurité !
  accent_color: '#9370DB'
- name: Je Ramasse !
  script: Oh, il est tombé ! Je le relève !
  accent_color: '#ADD8E6'
- name: Je Dépose !
  script: Je le mets juste là où il faut !
  accent_color: '#90EE90'
