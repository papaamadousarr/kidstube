series:
  key: serie_21
  title: Les Échelles de la Taille !
  voice: fr_FR-siwis-medium
  background_color: '#FFF0F5'
  intro_text: Comment l'ordinateur gère les choses, qu'elles soient petites ou très
    grandes !
items:
- name: Très très grand
  script: Des millions, des milliards d'informations à la fois !
  accent_color: '#FF69B4'
- name: Des millions d'infos
  script: Gérer des quantités d'informations immenses !
  accent_color: '#C71585'
- name: Gérer l'énorme
  script: Savoir tout organiser même quand c'est géant !
  accent_color: '#DB7093'
- name: Petit à grand
  script: Il peut s'adapter, que ce soit une ou mille choses !
  accent_color: '#FF1493'
- name: Changer d'échelle
  script: Passer du détail à la vue d'ensemble facilement !
  accent_color: '#FFC0CB'
