  script: Il collecte toutes sortes de données !
  accent_color: '#B0C4DE'
- name: Questionnaire
  script: Il pose des questions pour obtenir des réponses !
  accent_color: '#6A5ACD'
- name: Sondage
  script: Il demande l'avis de plein de monde !
  accent_color: '#483D8B'
- name: Observer
  script: Il regarde attentivement ce qui se passe !
  accent_color: '#7B68EE'
- name: Collecter les données
  script: Il réunit toutes les informations nécessaires !
  accent_color: '#8A2BE2'
- name: Chercher l'information
  script: Comme un détective, il va à la pêche aux infos !
  accent_color: '#9400D3'
