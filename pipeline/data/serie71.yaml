series:
  key: serie71
  title: La Case à Cocher !
  voice: fr_FR-siwis-medium
  background_color: '#E6E6FA'
  intro_text: Quand tu as plusieurs choix et que tu peux en prendre un ou plusieurs,
    tu cliques sur des petites cases ! C'est la case à cocher.
items:
- name: Case à cocher
  script: La petite boîte à choix !
  accent_color: '#6A5ACD'
- name: Choisir
  script: Sélectionner une option !
  accent_color: '#FFD700'
- name: Oui ou non
  script: J'active ou je désactive !
  accent_color: '#90EE90'
- name: Sélectionner
  script: Marquer mon choix !
  accent_color: '#ADD8E6'
- name: Option
  script: Une possibilité !
  accent_color: '#DDA0DD'
- name: Marquer
  script: Mettre une petite croix !
  accent_color: '#FFC0CB'
