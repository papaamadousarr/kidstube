series:
  key: serie_001
  title: Le Bouton Magique
  voice: fr_FR-siwis-medium
  background_color: '#F0F8FF'
  intro_text: Appuie ici pour voir la magie ! Les boutons nous aident à donner des
    ordres aux machines.
items:
- name: Le Bouton ON
  script: J'allume tout ! Vive l'aventure !
  accent_color: '#87CEEB'
- name: Le Bouton OFF
  script: J'éteins tout ! À bientôt !
  accent_color: '#A9A9A9'
- name: Le Bouton Play
  script: Je lance le jeu ! C'est parti !
  accent_color: '#90EE90'
- name: Le Bouton Stop
  script: J'arrête tout ! Doucement !
  accent_color: '#FFB6C1'
- name: Le Bouton Pause
  script: Je fais une petite pause ! Je reviens vite !
  accent_color: '#FFD700'
