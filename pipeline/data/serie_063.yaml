series:
  key: serie_063
  title: Le Chargement Rapide
  voice: fr_FR-siwis-medium
  background_color: '#FDF5E6'
  intro_text: Quand tu ouvres un jeu, l'ordinateur doit le charger pour que tu puisses
    jouer vite !
items:
- name: Le Jeu qui Arrive
  script: Mon jeu préféré est en route vers l'écran !
  accent_color: '#FFDEAD'
- name: Les Données qui Viennent
  script: Toutes les infos du jeu arrivent vite, vite !
  accent_color: '#DDA0DD'
- name: L'Attente
  script: Il faut attendre un petit peu ! Courage !
  accent_color: '#FFC0CB'
- name: C'est Prêt !
  script: Le jeu est là ! On peut commencer !
  accent_color: '#ADD8E6'
- name: Le Temps qui Passe
  script: La barre de chargement me dit si c'est long !
  accent_color: '#98FB98'
