series:
  key: serie_023
  title: La Boîte à Mots
  voice: fr_FR-siwis-medium
  background_color: '#FDF5E6'
  intro_text: Comme les nombres, on peut ranger des mots dans des boîtes spéciales
    qui peuvent changer !
items:
- name: Mon Prénom
  script: Je mets mon prénom dans la boîte ! Bonjour !
  accent_color: '#FFDEAD'
- name: Mon Animal Préféré
  script: Un chat ou un chien ? Je le range ici !
  accent_color: '#DDA0DD'
- name: Le Mot Mystère
  script: Un mot secret que je vais deviner !
  accent_color: '#FFC0CB'
- name: Je Change de Mot
  script: Mon mot d'avant s'en va, un nouveau arrive !
  accent_color: '#ADD8E6'
- name: La Phrase Magique
  script: J'assemble des mots pour faire une phrase !
  accent_color: '#98FB98'
