  accent_color: '#87CEEB'
  icon: 1f310
- name: Stocker
  script: Mettre des photos ou des jeux dans le nuage !
  accent_color: '#6495ED'
  icon: 1f4e6
- name: Partager
  script: Envoyer des choses du nuage à tes amis !
  accent_color: '#4682B4'
  icon: 1f91d
