series:
  key: cloud_nuage_donnees
  title: Le Cloud, un Nuage de Données !
  voice: fr_FR-siwis-medium
  background_color: '#B0C4DE'
  intro_text: Imagine un nuage géant où l'on range nos infos sans les garder chez
    nous !
items:
