  script: Un chemin bien pensé par l'ordinateur !
  accent_color: '#DB7093'
- name: Chemin le plus court
  script: Il trouve la route la plus courte pour arriver vite !
  accent_color: '#FF1493'
- name: Calculer la route
  script: Il fait des maths pour trouver le bon chemin !
  accent_color: '#FFC0CB'
- name: Voyage optimisé
  script: Le parcours est parfait pour ne pas perdre de temps !
  accent_color: '#FFB6C1'
