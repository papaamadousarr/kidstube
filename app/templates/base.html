<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tableau de bord{% endblock %} · Kidstube</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </span>
      <span>Kidstube</span>
    </div>
    <nav class="nav-links">
      <a class="nav-link {{ 'active' if request.endpoint and request.endpoint.startswith('board.') else '' }}"
         href="{{ url_for('board.board_view') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/>
        </svg>
        <span>Kanban</span>
      </a>
      <a class="nav-link {{ 'active' if request.endpoint and request.endpoint.startswith('ideas.') else '' }}"
         href="{{ url_for('ideas.ideas_list') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/>
        </svg>
        <span>Idées</span>
      </a>
      <a class="nav-link {{ 'active' if request.endpoint and request.endpoint.startswith('calendar.') else '' }}"
         href="{{ url_for('calendar.calendar_view') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        <span>Calendrier</span>
      </a>
      <a class="nav-link {{ 'active' if request.endpoint and request.endpoint.startswith('higgsfield.') else '' }}"
         href="{{ url_for('higgsfield.higgsfield_view') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.5 7 8 9.5v5L2.5 17z"/><rect x="8" y="6" width="13.5" height="12" rx="1.5"/><path d="M13 6v12M17 6v12"/>
        </svg>
        <span>Réalisme</span>
      </a>
    </nav>
  </aside>
  <div class="main">
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
